# Render Blueprint（Dashboard → New → Blueprint でこのリポジトリを選ぶと作られる）
# 値が sync: false の環境変数は、作成時に Dashboard で入力する（ここには書かない）
services:
  # アプリ（フロント + アプリサーバー）
  - type: web
    name: cafe-stock
    runtime: python
    region: singapore # Neon の ap-southeast-1（シンガポール）に近い所
    plan: free # 無料。15分無操作でスリープし、次に開くと約1分待つ。Shell も使えない。毎日使うなら starter（$7/月）に
    branch: main # GitFlow: main = 本番
    autoDeployTrigger: checksPass # CD: main への push で GitHub の CI が通ったときだけ自動デプロイ
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 2 --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true # Render が乱数で生成
      - key: DATABASE_URL # Neon の app_rw ロールの接続文字列（pooler 可・sslmode=require）
        sync: false
      - key: APP_ENCRYPTION_KEY # app.crypto.generate_key() で生成した鍵
        sync: false
      - key: ALLOWED_HOSTS # 実際の URL に合わせて直す（独自ドメインを足すならカンマ区切り）
        value: cafe-stock-tghx.onrender.com # Render が付けた実際の URL（cafe-stock は他で使用済みだった）
      - key: COOKIE_SECURE
        value: "1"

  # DB のバックアップ（毎日 3:00 JST に pg_dump → 暗号化 → Gmail）
  # ⏸ Gmail の準備（SETUP.md 6）が済むまで外している。戻すときは下の行頭の「# 」を外す。
  # 費用は動いた時間だけ（$0.00016/分。1回1分なら月 約 $0.005）。それまでのバックアップは Neon の履歴からの復元（さかのぼれる期間は短い）だけ
