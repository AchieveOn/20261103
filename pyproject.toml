[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]   # S = bandit（セキュリティ）
ignore = ["S101"]                          # assert はテストで使う

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
"backup/*" = ["S603"]
".github/scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
