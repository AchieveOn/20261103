# GitFlow の合流方向とコミット作者を PR で強制する（ローカルの Git hooks をすり抜けても止める）
#   main    ← release/X.Y.Z, hotfix/X.Y.Z
#   develop ← feature/*, bugfix/*, release/*, hotfix/*, main
name: GitFlow

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-rule:
    runs-on: ubuntu-latest
    steps:
      - name: Check source → target
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "$HEAD_REF → $BASE_REF"
          case "$BASE_REF" in
            main)
              [[ "$HEAD_REF" =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]] && exit 0
              echo "::error::main には release/X.Y.Z か hotfix/X.Y.Z からしかマージできません"; exit 1 ;;
            develop)
              [[ "$HEAD_REF" =~ ^(feature|bugfix)/[a-z0-9][a-z0-9._-]*$|^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$|^main$ ]] && exit 0
              echo "::error::develop には feature/ bugfix/ release/ hotfix/ main からしかマージできません"; exit 1 ;;
          esac

  # 公開リポジトリなので、PR のコミット作者は GitHub の noreply だけ（個人のメールを履歴に残さない）
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit author emails
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad="$(git log --format='%h %ae' "origin/$BASE_REF..$HEAD_SHA" | grep -vE ' ([^ ]+@users\.noreply\.github\.com|noreply@github\.com)$' || true)"
          if [[ -n "$bad" ]]; then
            echo "::error::noreply 以外の作者のコミットがあります（個人のメールが公開されます）"
            echo "$bad" | cut -d' ' -f1
            exit 1
          fi
